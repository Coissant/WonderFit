<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FitTrack — a fast, offline-first fitness & nutrition tracker for iPhone.">
  <meta name="theme-color" content="#0E0E11">
  <meta name="color-scheme" content="dark">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTrack">
  <meta name="format-detection" content="telephone=no">

  <title>FitTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Apply saved theme before first paint (prevents accent-color flash) -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('fittrack.theme') || 'null');
        if (!t) return;
        var r = document.documentElement;
        r.setAttribute('data-theme', t.theme || 'dark');
        if (t.accent) r.style.setProperty('--accent', t.accent);
        if (t.rgb) r.style.setProperty('--accent-rgb', t.rgb);
        if (t.contrast) r.style.setProperty('--accent-contrast', t.contrast);
      } catch (e) {}
    })();
  </script>
</head>
<body class="booting">
  <div id="app">
    <main id="views">
      <section id="view-dashboard" class="view" data-view="dashboard" aria-label="Dashboard"></section>
      <section id="view-workout" class="view" data-view="workout" aria-label="Live Workout"></section>
      <section id="view-nutrition" class="view" data-view="nutrition" aria-label="Nutrition"></section>
      <section id="view-settings" class="view" data-view="settings" aria-label="Settings"></section>
    </main>

    <!-- Floating rest timer (visible on every tab while resting) -->
    <div id="rest-timer" class="rest-timer hidden" role="timer" aria-live="polite"></div>

    <nav class="tab-bar" role="tablist" aria-label="Main">
      <button class="tab" data-tab="dashboard" role="tab" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="tab" data-tab="workout" role="tab" aria-label="Live Workout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
        <span>Workout</span>
        <i class="tab-dot" aria-hidden="true"></i>
      </button>
      <button class="tab" data-tab="nutrition" role="tab" aria-label="Nutrition">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-2.5-6-2.6-7.3 1.3C3.4 12.4 6.2 21 9.3 21c1.2 0 1.7-.6 2.7-.6s1.5.6 2.7.6c3.1 0 5.9-8.6 4.6-12.7C18 4.4 13.5 4.5 12 7z"/><path d="M12 7c0-2 1-4 3-4.5"/></svg>
        <span>Nutrition</span>
      </button>
      <button class="tab" data-tab="settings" role="tab" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="toast-root" aria-live="polite"></div>

  <!-- Hidden file inputs (must be triggered synchronously from a tap on iOS) -->
  <input type="file" id="meal-photo-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="import-input" accept="application/json,.json" hidden>

  <noscript><p style="padding:2rem;color:#fff">FitTrack needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
